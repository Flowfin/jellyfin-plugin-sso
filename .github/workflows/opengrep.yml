# Opengrep gate: enforces the greppable security invariants in tools/opengrep/rules.yml.
# Do not rename the job: "Enforce greppable invariants" is a required status context.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#opengrepyml
name: Repo Invariant Lint (Opengrep)

on:
  push:
    branches: [main, "4.*", "5.*"]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opengrep:
    name: Enforce greppable invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Bump OPENGREP_VERSION and OPENGREP_SHA256 together: the SHA is the sha256sum of the x86 asset.
      OPENGREP_VERSION: "v1.25.0"
      OPENGREP_SHA256: "9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Opengrep (pinned binary, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          # --proto '=https' --tlsv1.2: refuse any non-HTTPS transport, including on a redirect.
          curl -fSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -o opengrep "$url"
          echo "${OPENGREP_SHA256}  opengrep" | sha256sum -c -
          chmod +x opengrep

      - name: Enforce repo invariants
        run: ./opengrep scan --config tools/opengrep/rules.yml --error .
