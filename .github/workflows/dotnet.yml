# Builds, tests and scans the plugin on every push and pull request; the required checks live here.
# Do not rename the `build` job or give it a `name:`: the ruleset's required check matches that id.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#dotnetyml
name: .NET

on:
  push:
    branches: [ main, "4.*", "5.*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Jellyfin compatibility metadata check
      run: bash scripts/check-jellyfin-compat.sh
    - name: Settings-page field and controller reconciliation
      run: node tools/ui-mock-fields.js
    - name: Unsaved-changes state of the settings pages
      run: node tools/ui-unsaved-state.js
    - name: Library checklists on both client shapes
      run: node tools/ui-folder-checklist.js
    - name: Sentences that bypass the translation catalog
      run: node tools/ui-untranslated.js
    - name: Template text that bypasses the translation catalog
      run: node tools/ui-untranslated-markup.js
    - name: A sentence that holds markup
      run: node tools/ui-sentence-parts.js
    - name: The linked-accounts filter
      run: node tools/ui-account-filter.js
    - name: The pending-approvals panel
      run: node tools/ui-pending-approvals.js
    - name: The self-service unlink
      run: node tools/ui-self-service-unlink.js
    - name: The sign-out-everywhere control
      run: node tools/ui-sign-out-everywhere.js
    - name: The Test Connection verdict
      run: node tools/ui-test-verdict.js
    - name: The help census
      run: node tools/ui-help-census.js
    - name: The condensed help
      run: node tools/ui-condensed-help.js
    - name: The readiness rail
      run: node tools/ui-readiness-rail.js
    - name: The provider wizard
      run: node tools/ui-provider-wizard.js
    - name: The option folds
      run: node tools/ui-option-folds.js
    - name: Overview downgrade-mark check
      run: node tools/ui-overview-downgrade-mark.js
    - name: Dropped-secret report check
      run: node tools/ui-secret-dropped.js
    - name: VEX document check
      run: python3 scripts/check-vex.py security/vex/openvex.json
    - name: Release-leg VEX check
      run: python3 scripts/check-release-vex.py
    - name: Restore dependencies
      run: dotnet restore --locked-mode
    - name: Vulnerable dependency scan
      run: |
        set -o pipefail
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
        if grep -q "has the following vulnerable packages" vuln.txt; then
          echo "::error::Vulnerable NuGet dependencies found (see the log above)."
          exit 1
        fi
    - name: Build
      run: dotnet build --no-restore --warnaserror
    - name: Restore the fuzz harness (locked)
      run: dotnet restore SSO-Auth.Fuzz/SSO-Auth.Fuzz.csproj --locked-mode
    - name: Build the fuzz harness (Release)
      run: dotnet build SSO-Auth.Fuzz/SSO-Auth.Fuzz.csproj -c Release --no-restore --warnaserror
    - name: Replay the fuzz seed corpus
      run: |
        set -o pipefail
        shopt -s nullglob
        targets=0
        for dir in SSO-Auth.Fuzz/corpus/*/; do
          target="$(basename "$dir")"
          seeds="$(find "$dir" -type f | wc -l)"
          if [ "$seeds" -eq 0 ]; then
            echo "::error::The fuzz corpus for target '${target}' is empty, so replaying it proves nothing."
            exit 1
          fi
          echo "Replaying ${seeds} seed(s) through target '${target}'."
          SSO_FUZZ_SMOKE=1 SSO_FUZZ_TARGET="${target}" \
            dotnet SSO-Auth.Fuzz/bin/Release/net10.0/SSO-Auth.Fuzz.dll "${dir}"
          targets=$((targets + 1))
        done
        if [ "$targets" -eq 0 ]; then
          echo "::error::No fuzz corpus directories were found under SSO-Auth.Fuzz/corpus/."
          exit 1
        fi
        echo "Replayed ${targets} target(s) with no unmapped exception."
    - name: Test
      run: dotnet test --no-build --verbosity normal
    # --ignore-exit-code 2 tolerates a test failure under instrumentation only; the Test step above is the verdict.
    - name: Coverage (net10.0)
      run: dotnet test --project SSO-Auth.Tests/SSO-Auth.Tests.csproj -f net10.0 --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --ignore-exit-code 2
    - name: Enforce the security-surface coverage bars
      run: |
        set -o pipefail
        python3 scripts/check-coverage.py TestResults/coverage.cobertura.xml | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
      with:
        name: coverage-report
        retention-days: 30
        if-no-files-found: error
        path: TestResults/coverage.cobertura.xml

  abi-floor:
    name: ABI floor build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: Derive the targetAbi floor
      id: floor
      run: |
        floor=$(grep -oP 'targetAbi:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' build.yaml | head -1)
        echo "version=$floor" >> "$GITHUB_OUTPUT"
        echo "Building against Jellyfin $floor (the declared targetAbi floor)."
    - name: Build against the ABI floor
      env:
        FLOOR: ${{ steps.floor.outputs.version }}
      # RestoreLockedMode=false on purpose: the floor version differs from the lockfile's pin.
      run: dotnet build SSO-Auth/SSO-Auth.csproj -c Release --warnaserror -p:JellyfinVersion="$FLOOR" -p:RestoreLockedMode=false

  lean:
    name: Size report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Measure the product source and the workflows
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      run: |
        set -o pipefail
        args=()
        if [ -n "$BASE" ]; then args+=(--base "$BASE"); fi
        python3 tools/lean.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: Package (JPRM)
    # id-token/attestations: write only satisfy the reusable workflow's declared set; attest stays false, nothing is minted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"
