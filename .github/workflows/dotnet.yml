name: .NET

on:
  push:
    branches: [ main, "4.*", "5.*" ]
  pull_request:
    branches: [ "**" ]

# Read-only: build/test/scan only, no job here writes to the repo or a release.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job: the "Protect main" ruleset's required status check
  # matches the literal check-run name, which defaults to the job id ("build")
  # when no `name:` is set. Overriding it here would rename the check run and
  # silently break the required-status-check gate.
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No step pushes via git, so do not leave the GITHUB_TOKEN persisted in
        # .git/config (zizmor "artipacked" hardening - shrinks the credential blast radius).
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # Both SDKs the multi-target build needs (#135): net9.0 for the Jellyfin 10.11 line, net10.0 for
        # the Jellyfin 12.0 line. `dotnet build`/`test` (no -f) build and test every TargetFramework, so
        # install both explicitly rather than relying on whatever the runner image happens to ship.
        dotnet-version: |
          9.0.x
          10.0.x
        # Cache the NuGet global-packages folder keyed on the committed lockfiles,
        # so a clean --locked-mode restore is a cache hit.
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Jellyfin compatibility metadata check
      run: bash scripts/check-jellyfin-compat.sh
    - name: VEX document check
      # The published VEX statements are only useful if they parse and carry machine-readable
      # dispositions, so a malformed edit fails here rather than at the release leg that ships the
      # document (#1092). Structural only: the product-against-SBOM leg of the same checker takes the
      # SBOM as a second argument, and no SBOM exists at this point in the job.
      run: python3 scripts/check-vex.py security/vex/openvex.json
    - name: Release-leg VEX check
      # A valid document nobody ships is worth nothing to a consumer, so the leg set is
      # checked here too: every workflow that stages the SBOM as a release asset also stages
      # the VEX, with a sha256 and no md5 (#1093). Static, because the release legs run on a
      # tag rather than on a pull request - this is the only route that reads them before the
      # release they would have shipped from.
      run: python3 scripts/check-release-vex.py
    - name: Restore dependencies
      # --locked-mode fails the restore if the committed packages.lock.json files would change,
      # so a drifted or tampered dependency graph cannot build in CI.
      run: dotnet restore --locked-mode
    - name: Vulnerable dependency scan
      run: |
        set -o pipefail
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
        if grep -q "has the following vulnerable packages" vuln.txt; then
          echo "::error::Vulnerable NuGet dependencies found (see the log above)."
          exit 1
        fi
    - name: Build
      run: dotnet build --no-restore --warnaserror
    # The fuzz harness is deliberately absent from SSO-Auth.sln, so the restore and
    # build above never see it and a module rename in the plugin could break it
    # unnoticed until the weekly fuzzing run days later (#1132, #1008). Compiling it
    # inside the job the "Protect main" ruleset gates on makes that break red on the
    # PR that causes it.
    #
    # It stays OUT of the solution and is built by path on purpose: joining the
    # solution would also pull it into `dotnet test`, the coverage gate and the
    # vulnerable-dependency scan above, all of which are meant to see the shipping
    # project set and nothing else.
    #
    # This compiles the harness; it does not fuzz. No clang, no `sharpfuzz` CLI and
    # no libFuzzer runtime is needed for that, and the libFuzzer run itself stays
    # non-gating in fuzz.yml, which gains no push or pull_request trigger.
    - name: Restore the fuzz harness (locked)
      # Same --locked-mode reasoning as the solution restore above: the harness has
      # its own committed packages.lock.json and a drifted graph must not build.
      run: dotnet restore SSO-Auth.Fuzz/SSO-Auth.Fuzz.csproj --locked-mode
    - name: Build the fuzz harness (Release)
      run: dotnet build SSO-Auth.Fuzz/SSO-Auth.Fuzz.csproj -c Release --no-restore --warnaserror
    # Replaying the committed seeds is a BEHAVIOURAL gate, and it is a different
    # question from the compilation above: a plugin change can leave the harness
    # building perfectly while making a known-hostile input throw an exception the
    # fail-closed filters do not name, which on the real callback is an
    # unauthenticated 500. Smoke mode needs no clang, no `sharpfuzz` CLI and no
    # libFuzzer runtime, so this costs seconds; the coverage-guided run stays
    # non-gating in fuzz.yml, which still has no push or pull_request trigger.
    #
    # The target list is DERIVED from the corpus directories rather than written
    # here, so a target added to the harness is replayed by the fact of having a
    # corpus and cannot be silently uncovered by a list nobody updated.
    #
    # Both empty answers are failures. RunSmoke exits 2 for a missing directory but
    # 0 for a directory that happens to hold nothing, so a corpus that stopped
    # being checked out, or a glob that stopped matching, would otherwise read as a
    # clean pass. The seed count is counted here and required to be non-zero, and
    # the whole loop is required to have found at least one target.
    - name: Replay the fuzz seed corpus
      run: |
        set -o pipefail
        # nullglob so a corpus that vanished leaves the loop with nothing to do and
        # is caught by the counter below, rather than by `find` failing on a literal
        # unexpanded glob - both fail the step, but only one of them says why.
        shopt -s nullglob
        targets=0
        for dir in SSO-Auth.Fuzz/corpus/*/; do
          target="$(basename "$dir")"
          seeds="$(find "$dir" -type f | wc -l)"
          if [ "$seeds" -eq 0 ]; then
            echo "::error::The fuzz corpus for target '${target}' is empty, so replaying it proves nothing."
            exit 1
          fi
          echo "Replaying ${seeds} seed(s) through target '${target}'."
          SSO_FUZZ_SMOKE=1 SSO_FUZZ_TARGET="${target}" \
            dotnet SSO-Auth.Fuzz/bin/Release/net9.0/SSO-Auth.Fuzz.dll "${dir}"
          targets=$((targets + 1))
        done
        if [ "$targets" -eq 0 ]; then
          echo "::error::No fuzz corpus directories were found under SSO-Auth.Fuzz/corpus/."
          exit 1
        fi
        echo "Replayed ${targets} target(s) with no unmapped exception."
    - name: Test
      run: dotnet test --no-build --verbosity normal
    # Line and branch coverage for the RC coverage gate (#718, #1109). A second,
    # instrumented run of the net10.0 leg (the MTP CodeCoverage extension emits
    # Cobertura, carrying the branch counts per line as condition-coverage); the
    # plain run above stays the canonical pass/fail signal for test correctness,
    # so a test failure under instrumentation (exit code 2 - timing heisenbugs
    # under the ~13x instrumentation overhead) is ignored HERE only; the
    # zero-tests exit (8) and any collector failure still fail this step.
    - name: Coverage (net10.0)
      run: dotnet test --project SSO-Auth.Tests/SSO-Auth.Tests.csproj -f net10.0 --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --ignore-exit-code 2
    - name: Enforce the security-surface coverage bars
      # Fail-closed thresholds on the security-decision surface only (#718, #1109):
      # the whole-codebase line and branch numbers are reported into the job
      # summary below and go no further, while the gate keys on the modules that
      # decide auth/authz/linking/abuse outcomes, so a trivially-thin non-critical
      # path cannot trip it and a security-path regression cannot slip through it.
      #
      # set -o pipefail is LOAD-BEARING: without it the step's status is tee's
      # exit 0 and every rejection the script makes (below-bar, unreadable or
      # empty report) would be silently discarded - the gate would be decorative.
      # GitHub's default shell for a bare `run:` is `bash -e` WITHOUT pipefail
      # (the same trap the vulnerable-dependency step above guards against).
      run: |
        set -o pipefail
        python3 scripts/check-coverage.py TestResults/coverage.cobertura.xml | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      # always(): the report must survive a gate failure - it is exactly the
      # artifact needed to diagnose one. if-no-files-found stays error, so a
      # missing report still reds the job through this step.
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
      with:
        name: coverage-report
        retention-days: 30
        if-no-files-found: error
        path: TestResults/coverage.cobertura.xml

  # Verify the plugin's used Jellyfin API surface actually exists on the OLDEST server it claims to
  # support (build.yaml targetAbi), not only in the newer SDK the shipping build compiles against. A
  # member added after the floor would compile against the SDK but throw MissingMethodException at
  # login on an older 10.11 server (#142). Builds SSO-Auth against Jellyfin.* pinned to that floor.
  abi-floor:
    name: ABI floor build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x
    - name: Derive the targetAbi floor
      id: floor
      run: |
        floor=$(grep -oP 'targetAbi:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' build.yaml | head -1)
        echo "version=$floor" >> "$GITHUB_OUTPUT"
        echo "Building against Jellyfin $floor (the declared targetAbi floor)."
    - name: Build against the ABI floor
      # A deliberately different Jellyfin version than the shipping build, so locked-mode is off here;
      # --warnaserror turns any missing or changed API on the floor into a hard failure.
      #
      # Pinned to -f net9.0: build.yaml's targetAbi (10.11.0.0) is the .NET 9 / Jellyfin 10.11 line's
      # floor, so this check is a net9-line concept. Without -f, `dotnet build` on the multi-target
      # csproj would also build the net10.0 leg against Jellyfin 10.11.0.0 - which proves nothing about
      # the net10/JF12 floor AND needs a net10 SDK this job does not install (#135 review). The net10 leg
      # is fully built + tested by the primary `build` job; its own JF12 ABI floor lands with the JF12
      # publish pipeline.
      env:
        FLOOR: ${{ steps.floor.outputs.version }}
      run: dotnet build SSO-Auth/SSO-Auth.csproj -f net9.0 -c Release --warnaserror -p:JellyfinVersion="$FLOOR" -p:RestoreLockedMode=false

  # Verify the plugin actually packages as a loadable Jellyfin plugin (JPRM builds it against the
  # targeted ABI and produces the manifest) on every PR, not only at release time.
  package:
    name: Package (JPRM)
    # build.yml is a reusable workflow whose build job declares id-token/attestations: write for its
    # release-only SLSA attest step (#147). A caller must grant every permission the callee declares, or
    # the reusable-workflow call fails to start ("workflow file issue"). This CI caller leaves `attest`
    # at its default (false), so the attest step never runs and no token or attestation is minted - the
    # grant only satisfies the reusable-workflow permission check.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      dotnet-version: "9.0.x"
      dotnet-target: "net9.0"
