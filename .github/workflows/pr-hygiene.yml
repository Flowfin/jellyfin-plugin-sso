# Deterministic PR-hygiene checks (#171). A "Danger-style" gate implemented as a
# plain workflow + one first-party github-script step - no external Danger runtime,
# bot, or third-party review service (the merge gate is internal-only by policy;
# see the Review-Gate wiki page:
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate). It complements,
# never duplicates, the build/test, Prettier,
# CodeQL, Opengrep, zizmor, and Unicode-guard checks: those reason about the code;
# this reasons about the *pull request* (its linkage, size, and changelog/test
# co-changes) - a class none of them cover.
#
# This workflow BLOCKS a merge on its FAIL tier. Its job name, "Deterministic
# PR-hygiene checks", is in the branch ruleset's required set, so a red run holds
# the merge and only the WARN tier below is advisory. This header claimed the
# whole workflow was advisory and never blocked anything, and reading it sent an
# investigation of a blocked merge down the wrong path before the live ruleset
# was queried (#1199). Do not restate the required set here, where it drifts
# unnoticed; print it:
#
#   gh api repos/Flowfin/jellyfin-plugin-sso/rules/branches/main \
#     --jq '.[] | select(.type=="required_status_checks")
#           | .parameters.required_status_checks[].context'
#
# The checks are tiered by confidence so it does not red-flag reasonable PRs:
#   - FAIL  (high confidence, near-zero false-positive):
#       * PR body carries an issue reference (Closes/Refs #N).
#       * every commit subject carries a bracketed issue reference.
#       * every commit message, subject and body, stays inside an explicit
#         character set - printable ASCII plus a short table of code points
#         derived from the messages already on main (#1006).
#       * a build.yaml version bump also touches CHANGELOG.md.
#       * a pull request putting a non-English localization catalogue on the
#         board carries a vouch line naming the reader and the language (#1494).
#     The whole FAIL tier is skipped for bots, and for nobody else (#1516). It
#     was skipped for authors from outside this repository too, until the
#     association that decides it was read on two routes and answered
#     differently on each, on a board where every pull request comes from an
#     inside account - so the narrowing decided whether a required context could
#     fail at all, and nothing else. The character check and the catalogue vouch
#     still drop to the WARN tier for a bot rather than going silent, so a
#     skipped run is never mistaken for a clean one. The vouch check's own
#     self-test is outside the skip entirely: it judges the gate rather than the
#     author.
#   - WARN  (soft convention, annotation only - never fails):
#       * the diff is large (>=400 changed lines) - advisory; a feature, doc
#         migration, or bulk rename legitimately exceeds any cap, so size never reds.
#       * SSO-Auth code changed without a matching SSO-Auth.Tests change.
#
# Two acceptance-criteria items from #171 are intentionally NOT implemented here
# (sensitive-path sign-off grep, and issue-open triage-lint); the rationale is
# recorded in the Review-Gate wiki page
# (https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate) so the decision
# is auditable, not silent.
name: PR Hygiene

on:
  pull_request:
    # edited: so editing the body to add the issue reference re-runs the check.
    types: [opened, edited, synchronize, reopened]

# Explicit deny-all at workflow level; the job below grants only what it reads.
permissions: {}

# Cancel a superseded run on the same PR; this is an advisory lint, not a publish,
# so cancelling an obsolete run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Deterministic PR-hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read build.yaml/CHANGELOG changes via the pulls API
      pull-requests: read # read the PR body, labels, and changed-file list
    steps:
      # No checkout: every input is read from the PR metadata and the changed-file
      # patches via the API, so there is no untrusted working tree to guard.
      # Untrusted values (the PR body, labels, filenames) are only ever read from
      # the JS `context`/API objects - never interpolated into a shell `run:` - so
      # there is no template-injection surface (zizmor-clean by construction).
      - name: Run PR-hygiene checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const warnings = [];
            const failures = [];

            // --- Changed files (paginated) -------------------------------------
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map((f) => f.filename);
            const labels = (pr.labels || []).map((l) => l.name);
            const isBot = pr.user && pr.user.type === "Bot";

            // --- Who the FAIL tier is for (#1207 narrowed it, #1516 un-narrowed) -
            // EVERY AUTHOR, bots excepted. The tier used to skip an author whose
            // `author_association` was outside ["OWNER", "MEMBER"], on the argument
            // that the issue convention is ours and somebody arriving from outside
            // cannot know the issue numbers this board expects before they file.
            // The argument was sound; the field it rested on is not. Read through
            // the event payload and read through the pulls API, `author_association`
            // answers differently for the same account, so the narrowing decided
            // nothing except whether a required context could fail at all - and on
            // this board every pull request comes from an inside account, so it
            // could not. A required check that cannot fail refuses nothing while
            // reading as covered.
            //
            // The bot skip stays, and it is a different reason rather than the same
            // one narrower: it is keyed on the account BEING a bot, which no
            // reading of a payload moves, and a bot cannot know the convention.
            //
            // What the old skip protected is not lost. The linkage an outside
            // contribution owes moves to whoever handles it, and the failure they
            // meet names what to add rather than refusing the work: an issue
            // reference in the body, filed where no issue exists yet.
            const failTierApplies = !isBot;
            if (!isBot) {
              warnings.push(
                "The failing tier applies to this author " +
                  `(author_association: ${pr.author_association || "NONE"}). It is ` +
                  "applied whatever that value is, since #1516: reading it decided " +
                  "nothing but whether the tier ran, and it answered differently on " +
                  "the two routes that read it.",
              );
            }

            // --- Check 1: PR body references an issue (Closes/Refs #N) ----------
            // Directive: every change is issue-driven and linked. Bots (Dependabot)
            // open PRs with no issue, so they are exempt, and no author is (#1516).
            // A bare `#123`, a keyword
            // form (`Closes #123`), or a full issue URL all satisfy it - lenient on
            // purpose so a legitimately-linked PR is never flagged on phrasing.
            const body = pr.body || "";
            const hasIssueRef =
              /(^|[^\w])#\d+\b/.test(body) ||
              /github\.com\/[^\/\s]+\/[^\/\s]+\/issues\/\d+/i.test(body);
            if (failTierApplies && !hasIssueRef) {
              failures.push(
                "PR body has no issue reference. Link the issue it addresses " +
                  "(e.g. `Closes #123` or `Refs #123`).",
              );
            }

            // --- Check 1b: every commit subject carries [#N] refs (#817) ---------
            // My rule: traceability must survive down to the single commit -
            // blame/bisect/log show a commit's SUBJECT line without its PR, so the
            // PR-body link (check 1) is not enough. The reference lives in the
            // subject, bracketed, one bracket per issue: `Fix the thing [#12][#34]`.
            // (GitHub's auto-close keywords still go in the body - `[#N]` in a
            // subject does not close anything.) Bots and merge commits (subject
            // starts with "Merge ") are exempt, and no author is (#1516); merge
            // commits are machine-generated and inherit the merged PR's own
            // linkage.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const subjectHasBracketedRef = (message) =>
              /\[#\d+\]/.test(message.split("\n")[0]);
            const unlinked = commits.filter((c) => {
              const authorIsBot =
                (c.author && c.author.type === "Bot") ||
                /\[bot\]/.test((c.commit.author && c.commit.author.name) || "");
              const isMerge =
                c.parents.length > 1 || c.commit.message.startsWith("Merge ");
              return (
                !authorIsBot && !isMerge && !subjectHasBracketedRef(c.commit.message)
              );
            });
            if (failTierApplies && unlinked.length > 0) {
              const list = unlinked
                .map((c) => `${c.sha.slice(0, 7)} ("${c.commit.message.split("\n")[0]}")`)
                .join(", ");
              failures.push(
                `Commit subject(s) without a bracketed issue reference: ${list}. ` +
                  "Every commit subject must end with its issue reference(s) in " +
                  "the form `[#N]` (multiple issues: `[#N][#M]`).",
              );
            }

            // --- Check 1c: the commit message character set (#1006) -------------
            // Subject AND body, every commit in the PR range. The repertoire is an
            // explicit allowlist rather than a blocklist of known-bad code points:
            // that is the recommendation of Unicode Technical Standard #55 and the
            // Trojan-Source work (CVE-2021-42574), and it is the only form that
            // holds against a script nobody has thought of yet. Bidi controls,
            // zero-width joiners and homoglyphs are outside it without being named.
            //
            // Why the trailer needs its own check when `.cs` and workflow files
            // already have one: the Unicode-guard job scans files in the tree, this
            // scans git metadata, and no input is shared. A commit message is also
            // immutable once it is on main - the repair for a bad one is a history
            // rewrite - so the gate has to sit before the merge or not at all.
            //
            // The set is DERIVED, not remembered. Over all 1707 commits reachable
            // from main at the time of writing, nine code points outside printable
            // ASCII occur:
            //
            //   U+2014 EM DASH                       694    permitted
            //   U+2192 RIGHTWARDS ARROW               13    permitted
            //   U+2026 HORIZONTAL ELLIPSIS            10    permitted
            //   U+00A7 SECTION SIGN                    8    permitted
            //   U+0009 TAB                             4    permitted
            //   U+00DC LATIN CAPITAL U WITH DIAERESIS  2    permitted
            //   U+2265 GREATER-THAN OR EQUAL TO        1    permitted
            //   U+2013 EN DASH                         1    permitted
            //   U+2024 ONE DOT LEADER                  1    REFUSED
            //
            //   git log --format=%H%x1f%B%x1e origin/main   (counted per code point)
            //
            // U+2024 is the reason this check exists rather than an illustration of
            // it: in 6fc801f it sits inside "(…․0)" where a full stop belongs, in a
            // merged commit body, and nothing saw it. It is left out of the set on
            // purpose - a period homoglyph has no legitimate use here.
            //
            // The German letters are the one addition not individually measured.
            // U+00DC is measured, and the rest of that class arrives the same way:
            // this repo quotes its own toolchain output as evidence, and on the
            // machine that produces it that output is German. Refusing "ausgeführt"
            // would make this gate fight the rule that a claim carries the command
            // that produced it. Widening further is a deliberate edit of this table,
            // which is the point of an allowlist; nothing here widens by pattern.
            const ALLOWED_CODE_POINTS = new Map([
              [0x0009, "TAB"],
              [0x000a, "LINE FEED"],
              [0x000d, "CARRIAGE RETURN"],
              [0x00a7, "SECTION SIGN"],
              [0x00c4, "LATIN CAPITAL LETTER A WITH DIAERESIS"],
              [0x00d6, "LATIN CAPITAL LETTER O WITH DIAERESIS"],
              [0x00dc, "LATIN CAPITAL LETTER U WITH DIAERESIS"],
              [0x00df, "LATIN SMALL LETTER SHARP S"],
              [0x00e4, "LATIN SMALL LETTER A WITH DIAERESIS"],
              [0x00f6, "LATIN SMALL LETTER O WITH DIAERESIS"],
              [0x00fc, "LATIN SMALL LETTER U WITH DIAERESIS"],
              [0x2013, "EN DASH"],
              [0x2014, "EM DASH"],
              [0x2026, "HORIZONTAL ELLIPSIS"],
              [0x2192, "RIGHTWARDS ARROW"],
              [0x2265, "GREATER-THAN OR EQUAL TO"],
            ]);
            const isPermitted = (cp) =>
              (cp >= 0x20 && cp <= 0x7e) || ALLOWED_CODE_POINTS.has(cp);
            const asEscape = (cp) =>
              `U+${cp.toString(16).toUpperCase().padStart(4, "0")}`;

            // The offending line is echoed with every refused code point replaced by
            // its escape. Echoing the raw character would reproduce the rendering
            // attack inside the log that reports it, which is the one place it must
            // not happen.
            const neutralise = (line) =>
              [...line]
                .map((ch) =>
                  isPermitted(ch.codePointAt(0)) ? ch : `<${asEscape(ch.codePointAt(0))}>`,
                )
                .join("");

            const charFindings = [];
            for (const c of commits) {
              const lines = (c.commit.message || "").split("\n");
              lines.forEach((line, index) => {
                for (const ch of line) {
                  const cp = ch.codePointAt(0);
                  if (!isPermitted(cp)) {
                    charFindings.push(
                      `${c.sha.slice(0, 7)} line ${index + 1}: ${asEscape(cp)} - ` +
                        `"${neutralise(line)}"`,
                    );
                    break;
                  }
                }
              });
            }
            if (charFindings.length > 0) {
              const REPORTED = 20;
              const shown = charFindings.slice(0, REPORTED);
              const tail =
                charFindings.length > REPORTED
                  ? ` (${charFindings.length - REPORTED} further line(s) not listed)`
                  : "";
              const report =
                "Commit message character(s) outside the permitted set:\n" +
                shown.map((f) => `  ${f}`).join("\n") +
                tail +
                "\nThe permitted set is printable ASCII plus the named code points " +
                "listed at check 1c in .github/workflows/pr-hygiene.yml. Repair the " +
                "message before it reaches main, where it can only be repaired by " +
                "rewriting history.";
              // Outside the FAIL tier - a bot, and since #1516 nothing else - this
              // is reported and not failed. Reporting rather than staying silent
              // keeps the skip from reading as "nothing was found here", which is
              // the shape a hostile message would arrive in.
              (failTierApplies ? failures : warnings).push(report);
            }

            // --- Check 2: a build.yaml version bump must touch CHANGELOG.md -----
            // The version field only changes in a release PR, which must also record
            // the release in CHANGELOG.md. Near-zero false-positive: a non-release PR
            // never edits the `version:` line, so this stays silent for it. It is in
            // the FAIL tier, so it takes the same bot skip as checks 1 and 1b - the
            // tier is skipped as a whole rather than per check, so a later reader
            // does not have to work out which failures a skip covered.
            const buildYaml = files.find((f) => f.filename === "build.yaml");
            const versionBumped =
              buildYaml &&
              buildYaml.patch &&
              /^\+\s*version:/m.test(buildYaml.patch);
            if (failTierApplies && versionBumped && !changed.includes("CHANGELOG.md")) {
              failures.push(
                "build.yaml `version:` changed but CHANGELOG.md was not updated. " +
                  "Record the release in CHANGELOG.md.",
              );
            }

            // --- Check 3: PR size (WARN only - never fails) --------------------
            // Rationale (#171): reviewer effectiveness - human and AI - degrades on
            // very large diffs, so a big PR is worth a closer look. But "large" is
            // not "wrong": a feature, a doc migration, or a bulk rename legitimately
            // exceeds any line cap, so size is ADVISORY ONLY and never reds a
            // legitimate PR (no hard cap, no override label needed). Generated/lock
            // files are excluded so the count reflects human-authored change.
            const isGenerated = (name) =>
              name.endsWith("packages.lock.json") ||
              name.endsWith(".min.js") ||
              name.endsWith(".min.css");
            const churn = files
              .filter((f) => !isGenerated(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const WARN_AT = 400;
            if (churn >= WARN_AT) {
              warnings.push(
                `PR changes ${churn} lines (excluding generated/lock files). ` +
                  `Large PRs get a closer look - reviews degrade past ~${WARN_AT} lines.`,
              );
            }

            // --- Check 4: code changed without a matching test change (WARN) ----
            // Soft convention: a behavioural change to SSO-Auth should move a test.
            // Warn only - a docs/comment-only edit, a pure refactor, or a project-file
            // tweak legitimately touches no test, and hard-failing those would be the
            // exact false-positive friction #171 warns against.
            const codeChanged = changed.some(
              (n) => n.startsWith("SSO-Auth/") && n.endsWith(".cs"),
            );
            const testsChanged = changed.some((n) =>
              n.startsWith("SSO-Auth.Tests/"),
            );
            if (codeChanged && !testsChanged) {
              warnings.push(
                "SSO-Auth/*.cs changed but no SSO-Auth.Tests/* change is in this PR. " +
                  "Confirm the change is genuinely untestable (docs/refactor) or add a test.",
              );
            }

            // --- Check 5: a non-English catalogue needs a named vouch (#1494) ---
            // #1154 decided that a catalogue ships when a person who reads that
            // language has read it. The tree half of that is built and bites:
            // `CommittedCultures` in
            // SSO-Auth.Tests/Localization/LocalizationCatalogTests.cs refuses a
            // catalogue whose culture is not declared. But what that guard asks is
            // whether a culture is DECLARED, and adding the name to the list is
            // exactly as cheap as adding the file beside it - so nothing anywhere
            // asked whether the reading the declaration stands for happened.
            //
            // It has already gone wrong once. `de.json` is on the mainline and
            // nobody has read it: its pull request was a draft on purpose and the
            // draft state WAS the vouch, which is one click from not-a-draft with
            // the click leaving no trace anybody reads. This is that vouch moved
            // into a sentence a machine reads, which cannot be clicked past.
            //
            // WHAT THIS CANNOT DO, and the disclosure stays negative: it reads a
            // sentence. It proves that somebody put a name to a reading. It never
            // proves the reading happened, no reader's command of the language is
            // checked, and it reads a pull request rather than the tree - so a
            // catalogue already on main is outside it entirely, `de.json`
            // included.
            const VOUCH_FORM = "Catalogue-Vouch: <culture> read by <name>";
            const VOUCH_LINE =
              /^[ \t]*Catalogue-Vouch:[ \t]*([A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*)[ \t]+read by[ \t]+(\S.*)$/gim;
            const CATALOGUE_PREFIX = "SSO-Auth/Localization/";
            const DECLARATION_FILE =
              "SSO-Auth.Tests/Localization/LocalizationCatalogTests.cs";
            const DECLARATION_TOKEN = "CommittedCultures =";

            const cultureOfCatalogue = (filename) =>
              filename.startsWith(CATALOGUE_PREFIX) && filename.endsWith(".json")
                ? filename.slice(filename.lastIndexOf("/") + 1, -".json".length)
                : null;

            const declaredOn = (patch, sign) =>
              (patch || "")
                .split("\n")
                .filter(
                  (line) =>
                    line.startsWith(sign) && line.includes(DECLARATION_TOKEN),
                )
                .flatMap((line) =>
                  [...line.matchAll(/"([^"]*)"/g)].map((m) => m[1].toLowerCase()),
                );

            // Two independent readings of the same pull request, because the two
            // orders of the same mistake look different. The catalogue file is the
            // load-bearing one: a culture cannot reach a user without one, since
            // EveryCommittedCulture_HasACatalog reddens the suite for a declared
            // culture with no file. Reading the declaration patch catches the
            // reverse order, and its bound is that it matches the declaration on a
            // single patch line - a declaration rewritten across several lines is
            // invisible to it, which is why it is the second reading and not the
            // check.
            const culturesNeedingAVouch = (prFiles) => {
              const needed = new Set();
              for (const file of prFiles) {
                if (file.status === "removed") continue;
                const culture = cultureOfCatalogue(file.filename);
                if (culture) needed.add(culture.toLowerCase());
                if (file.filename === DECLARATION_FILE) {
                  const before = new Set(declaredOn(file.patch, "-"));
                  for (const added of declaredOn(file.patch, "+")) {
                    if (!before.has(added)) needed.add(added);
                  }
                }
              }
              // English is the baseline rather than a translation - it is the
              // invariant fallback every other catalogue is compared against - so a
              // change to it is not a reading anybody can vouch for. Subtracted once,
              // at the end, because both readings above can produce it and a second
              // exemption at the catalogue reading was dead: it survived being
              // inverted with the whole self-test still green.
              needed.delete("en");
              return [...needed].sort();
            };

            const missingVouches = (prFiles, prBody) => {
              const vouched = new Set(
                [...(prBody || "").matchAll(VOUCH_LINE)].map((m) =>
                  m[1].toLowerCase(),
                ),
              );
              return culturesNeedingAVouch(prFiles).filter((c) => !vouched.has(c));
            };

            // The near-misses this guard owes, executed on every pull request rather
            // than pasted once into a body nobody re-reads. A workflow is the class
            // of change CI cannot otherwise exercise at all, and the whole table
            // costs milliseconds, no checkout and no new apparatus. The first two
            // rows are the two the issue names: a change to the English baseline
            // alone, and a change touching neither path.
            //
            // A disagreement here fails the job OUTSIDE the audience narrowing
            // below. That narrowing is about whose obligation a convention is; a
            // self-test that disagrees means this gate no longer decides what it
            // says it decides, and nothing should merge past a broken gate whoever
            // opened the pull request.
            const DECLARATION_WAS =
              '-    private static readonly string[] CommittedCultures = ["de", "en"];';
            const catalogue = (name, status) => [
              { filename: CATALOGUE_PREFIX + name, status },
            ];
            const declaration = (patch) => [
              { filename: DECLARATION_FILE, status: "modified", patch },
            ];
            const SELF_TEST = [
              [
                "the English baseline alone",
                catalogue("en.json", "modified"),
                "",
                [],
              ],
              [
                "a change touching neither path",
                [
                  {
                    filename: "SSO-Auth/Api/Http/SSOController.cs",
                    status: "modified",
                  },
                ],
                "",
                [],
              ],
              [
                "a new catalogue, unvouched",
                catalogue("fr.json", "added"),
                "",
                ["fr"],
              ],
              [
                "a new catalogue, vouched",
                catalogue("fr.json", "added"),
                "Closes #1\n\nCatalogue-Vouch: fr read by A. Reader\n",
                [],
              ],
              [
                "a new catalogue, a different language vouched",
                catalogue("fr.json", "added"),
                "Catalogue-Vouch: de read by A. Reader",
                ["fr"],
              ],
              [
                "an existing catalogue edited, unvouched",
                catalogue("pt-BR.json", "modified"),
                "",
                ["pt-br"],
              ],
              ["a catalogue deleted", catalogue("fr.json", "removed"), "", []],
              [
                "the declaration gains a culture",
                declaration(
                  DECLARATION_WAS +
                    '\n+    private static readonly string[] CommittedCultures = ["de", "en", "fr"];',
                ),
                "",
                ["fr"],
              ],
              [
                "the declaration loses a culture",
                declaration(
                  DECLARATION_WAS +
                    '\n+    private static readonly string[] CommittedCultures = ["en"];',
                ),
                "",
                [],
              ],
            ];
            for (const [name, prFiles, prBody, expected] of SELF_TEST) {
              const got = missingVouches(prFiles, prBody);
              if (got.join(",") !== expected.join(",")) {
                failures.push(
                  `Check 5 self-test "${name}" disagreed: expected ` +
                    `[${expected.join(", ")}], got [${got.join(", ")}]. The ` +
                    "catalogue-vouch gate at check 5 in " +
                    ".github/workflows/pr-hygiene.yml no longer decides what it says " +
                    "it decides; repair it before merging anything.",
                );
              }
            }

            // The FAIL tier's bot skip is taken here deliberately rather than
            // inherited without a thought. A bot cannot discharge this: the vouch
            // names a READER who has read that language, and an account that is not
            // a person is not one. An outside contributor offering a catalogue in
            // their own language is the growth path #1154 named, and since #1516
            // this reds for them like everybody else - the vouch they cannot write
            // for their own translation is written by whoever merges the
            // contribution, which is a line on the pull request rather than a
            // refusal of the work. Reported rather than silent for a bot, like
            // check 1c, so a skipped run is never read as a clean one.
            const unvouched = missingVouches(files, body);
            if (unvouched.length > 0) {
              const report =
                `Catalogue(s) for ${unvouched.join(", ")} change in this pull request ` +
                "with no vouch in its body. A catalogue ships when a person who reads " +
                "that language has read it (#1154). Add one line per language, at the " +
                "start of its own line:\n" +
                `  ${VOUCH_FORM}\n` +
                "This check reads a sentence: it proves somebody put a name to a " +
                "reading, never that the reading happened, and it reads the pull " +
                "request rather than the tree.";
              (failTierApplies ? failures : warnings).push(report);
            }

            // --- Report --------------------------------------------------------
            for (const w of warnings) core.warning(w);
            const summary = core.summary.addHeading("PR-hygiene checks", 2);
            if (failures.length === 0 && warnings.length === 0) {
              summary.addRaw("All deterministic PR-hygiene checks passed.");
            } else {
              if (failures.length) {
                summary.addHeading("Failures", 3).addList(failures);
              }
              if (warnings.length) {
                summary.addHeading("Warnings (non-blocking)", 3).addList(warnings);
              }
            }
            await summary.write();

            if (failures.length) {
              core.setFailed(failures.join(" | "));
            }
