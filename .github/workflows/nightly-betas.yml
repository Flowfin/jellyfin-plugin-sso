# Daily scheduler on the default branch: dispatches publish-jf12-beta.yml on the line branch.
# The --ref below is the branch the betas build from: rename that branch and this line follows.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Releasing#nightly-betasyml
name: Nightly betas

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC, once daily
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-betas
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch the daily beta builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger the JF12 beta (the 5.1 development branch)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run publish-jf12-beta.yml --repo "$REPO" --ref 5.1
