# TEMPORARY, and removed before this branch merges. It executes the one thing #1462's change adds that no
# local run can reach: whether `uses: ./.github/workflows/e2e-login.yml` with a `providers` input resolves
# at all, and whether the harness runs under the permissions a calling job grants it. publish-beta.yml is
# the real caller and cannot be exercised without publishing a release, so this stands in for it on the
# pull-request route, with the same input the publish will pass. `providers: canonical` was tried first
# and proved the route resolves, but it selects the same one stack a missing input would, so it could not
# tell the input apart from the default. `providers: all` can: seven jobs mean the value crossed the call
# boundary, and it is the first time this repository has run the cross-provider pass through the route a
# publish will take.
#
# Landing the call route unexercised would repeat the defect #1462 is about: a gate nothing has ever run.
name: Probe - the harness is reachable by workflow_call (#1462)

on:
  pull_request:
    paths:
      - ".github/workflows/e2e-login.yml"
      - ".github/workflows/publish-beta.yml"
      - ".github/workflows/probe-workflow-call-1462.yml"

# Deny-all at the workflow level; the calling job grants the called workflow exactly what publish-beta.yml
# grants it and nothing else.
permissions: {}

jobs:
  call:
    name: Call the harness the way publish-beta.yml does
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-login.yml
    with:
      providers: all
