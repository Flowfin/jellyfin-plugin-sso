# Prettier check on every push and pull request: js, html, md, css and scss must be formatted.
# Do not add a name: to the job: the required status context is the job id "prettier".
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#prettieryml
name: Prettier Lint

on:
  push:
    branches: [ main, "4.*", "5.*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Default checkout (the PR merge commit), not head_ref: that was an untrusted-checkout finding.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prettify code
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          dry: True
          prettier_options: '--check **/*.{js,html,md,css,scss}'
