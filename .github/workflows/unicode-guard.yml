# Rejects Trojan Source Unicode (CVE-2021-42574): bidi and zero-width controls in tracked text.
# Do not rename the job: "Reject Trojan Source Unicode" is a required status context.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#unicode-guardyml
name: unicode-guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bidi:
    name: Reject Trojan Source Unicode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject bidirectional / invisible Unicode control characters
        run: |
          # U+FEFF (BOM) is deliberately not listed: a leading BOM is legitimate (SSO-Auth.sln carries one).
          pattern='(*UTF)[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{200E}\x{200F}\x{061C}\x{200B}-\x{200D}\x{2060}]'
          # git grep: 0 = match, 1 = clean, >=2 = scanner error; || rc=$? keeps set -e off the clean 1.
          rc=0
          git grep -nIP "$pattern" -- . || rc=$?
          case "$rc" in
            0)
              echo "::error::Dangerous bidirectional/invisible Unicode found (Trojan Source, CVE-2021-42574). Remove these control characters."
              exit 1
              ;;
            1)
              echo "No bidirectional or invisible Unicode control characters found."
              ;;
            *)
              echo "::error::unicode-guard scanner error (git grep exit $rc) - failing closed instead of assuming the tree is clean."
              exit 1
              ;;
          esac
