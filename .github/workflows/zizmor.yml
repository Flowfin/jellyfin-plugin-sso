# Audits the workflow YAML with zizmor (regular persona, --min-severity=low) on every push and PR.
# Do not rename the job: "Audit workflows (zizmor)" is a required status context.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#zizmoryml
name: Workflow Security Analysis

on:
  push:
    branches: [ main, "4.*", "5.*" ]
  pull_request:
    branches: [ "**" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF into the code-scanning tab
      contents: read # checkout the workflows to scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read from requirements/zizmor.in rather than restated here: nothing updates a workflow env value.
      - name: Read the pinned zizmor version from its requirements input
        run: |
          set -euo pipefail
          v=$(sed -n "s/^zizmor==//p" requirements/zizmor.in | head -1)
          if [ -z "${v}" ]; then
            echo "::error::requirements/zizmor.in names no zizmor pin"
            exit 1
          fi
          echo "ZIZMOR_VERSION=${v}" >> "${GITHUB_ENV}"
          echo "zizmor ${v} is the pinned version, read from requirements/zizmor.in"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Pinned: uv verifies the hashes, so an unpinned uv is an unpinned verifier.
          version: "0.11.32"

      - name: Install zizmor from the hash-pinned closure
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/zizmor-venv"
          uv pip install --python "${RUNNER_TEMP}/zizmor-venv/bin/python" \
            --no-build --require-hashes -r requirements/zizmor.txt

      - name: Assert the installed auditor is the pinned one
        run: |
          set -euo pipefail
          installed=$("${RUNNER_TEMP}/zizmor-venv/bin/zizmor" --version | awk '{print $NF}')
          if [ "${installed}" != "${ZIZMOR_VERSION}" ]; then
            echo "::error::the pinned closure installs zizmor ${installed}, not ${ZIZMOR_VERSION}"
            exit 1
          fi
          echo "zizmor ${installed} installed from the hash-pinned closure."

      - name: Audit workflows (SARIF for code scanning)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/zizmor-venv/bin/zizmor" --strict-collection --min-severity=low --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        # Fork and Dependabot PRs carry a read-only token; the gate step below still runs and blocks.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail on actionable findings
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/zizmor-venv/bin/zizmor" --strict-collection --min-severity=low --format=plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
