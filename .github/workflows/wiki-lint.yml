# Lints the live wiki against the code tree: anchors, file:line citations, dead source links (#873).
# Do not add a paths filter to the push trigger or a pull_request trigger (#1151).
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#wiki-lintyml
name: Wiki Lint

on:
  gollum:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# The event name is in the group so a wiki edit and a code merge do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone the wiki
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "${RUNNER_TEMP}/wiki"
      - name: Report the wiki revision this run read
        run: |
          wiki_sha="$(git -C "${RUNNER_TEMP}/wiki" rev-parse HEAD)"
          echo "Wiki revision linted: ${wiki_sha}"
          {
            echo "### Wiki Lint"
            echo
            echo "Wiki revision read: \`${wiki_sha}\`"
            echo
            echo "Code revision read: \`${GITHUB_SHA}\` (trigger: \`${GITHUB_EVENT_NAME}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the dead-source-link check bites before trusting its verdict
        run: python3 scripts/wiki-lint-test.py
      - name: Lint the wiki against the code tree
        run: python3 scripts/wiki-lint.py "${RUNNER_TEMP}/wiki" "${GITHUB_WORKSPACE}"
