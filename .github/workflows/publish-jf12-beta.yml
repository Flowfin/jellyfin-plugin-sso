# Publishes a Jellyfin 12 beta from the dispatched branch: gate, matrix, build, release, manifest.
# Do not drop the .md5 sidecar: the manifest checksum is read from it and installs fail without it.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Releasing#publish-jf12-betayml
name: Publish JF12 Beta

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-manifest-beta
  cancel-in-progress: false

jobs:
  gate:
    name: Gate on new commits in the dispatched ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      base: ${{ steps.version.outputs.base }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: build.yaml
        sparse-checkout-cone-mode: false
    - name: Derive the JF12 beta version
      id: version
      env:
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        base=$(grep -E '^version:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' build.yaml \
          | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
        if [ -z "$base" ]; then
          echo "::error::Could not read a three-part version from build.yaml"; exit 1
        fi
        echo "base=${base}" >> "$GITHUB_OUTPUT"
        echo "beta=${base}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
    - name: Compare the dispatched ref HEAD to the last JF12 beta
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        CUR: ${{ github.sha }}
      run: |
        set -uo pipefail
        # --paginate is load-bearing: ref pages sort lexicographically, newest tag leaves page 1.
        last_tag=$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/5.1.1-JF12-beta." \
          --jq '.[].ref | sub("refs/tags/"; "") | select(test("^5[.]1[.]1-JF12-beta[.][0-9]+$"))' 2>/dev/null \
          | sort -t. -k4 -n | tail -1 || echo "")
        last_sha=""
        if [ -n "$last_tag" ]; then
          last_sha=$(gh api "repos/${REPO}/git/refs/tags/${last_tag}" --jq '.object.sha' 2>/dev/null || echo "")
        fi
        echo "current ref HEAD: ${CUR}"
        echo "last JF12 beta:   ${last_tag:-<none>} -> ${last_sha:-<none>}"
        if [ -n "$last_sha" ] && [ "$last_sha" = "$CUR" ]; then
          echo "No new commits since the last JF12 beta; skipping the build."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  provider-matrix:
    name: Provider matrix (net10.0 into a Jellyfin 12 server)
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-login.yml
    with:
      providers: all
    secrets:
      PAIRWISE_READ_TOKEN: ${{ secrets.PAIRWISE_READ_TOKEN }}

  package:
    name: Build the JF12 beta package
    needs: [gate, provider-matrix]
    if: needs.gate.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"
      version: ${{ needs.gate.outputs.beta }}
      attest: true

  publish:
    name: Publish the JF12 beta
    needs: [gate, package]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    # The checkout comes first: actions/checkout cleans the workspace and would delete a download.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download the package built above
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifact
        path: _dist
    - name: Download the SBOM
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom-artifact
        path: _dist
    - name: Download the VEX
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vex-artifact
        path: _dist
    - name: Check the version survived the job boundary
      env:
        BASE: ${{ needs.gate.outputs.base }}
        BETA: ${{ needs.gate.outputs.beta }}
      run: |
        set -u
        if ! printf '%s' "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::The gate job handed over base='${BASE}', which is not a three-part version"; exit 1
        fi
        if ! printf '%s' "$BETA" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::The gate job handed over beta='${BETA}', which is not a four-part version"; exit 1
        fi
        if [ "$BETA" != "${BASE}.${GITHUB_RUN_NUMBER}" ]; then
          echo "::error::base='${BASE}' and beta='${BETA}' do not name one build at run ${GITHUB_RUN_NUMBER}"; exit 1
        fi
        echo "releasing ${BASE}-JF12-beta.${GITHUB_RUN_NUMBER} (plugin version ${BETA})"
    - name: Prepare GitHub Release assets
      run: |-
        pushd _dist
        ls ./*.zip.intoto.jsonl
        # ONLY the plugin zip gets a .md5: the manifest generator keeps the LAST .md5 as checksum.
        for file in ./*.zip; do
          md5sum ${file#./} > ${file%.*}.md5
          sha256sum ${file#./} > ${file%.*}.sha256
        done
        sha256sum sbom.cyclonedx.json > sbom.cyclonedx.sha256
        sha256sum openvex.json > openvex.sha256
        ls -l
        popd
    - name: Upload JF12 beta assets to a draft release
      id: publish-assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
          draft: true
          prerelease: true
          name: ${{ needs.gate.outputs.base }}-JF12-beta
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ needs.gate.outputs.base }}-JF12-beta.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            _dist/*
          body: |
            Jellyfin 12.0 (.NET 10) beta ${{ needs.gate.outputs.base }}-JF12-beta (plugin version ${{ needs.gate.outputs.beta }}).
            Install via the beta repository URL (a Jellyfin 12.0 server picks this build automatically by targetAbi):
            https://raw.githubusercontent.com/${{ github.repository }}/manifest-beta/manifest.json

            Scope note (#743/#1466): the JF12/5.0 line has **had no manual Release-QA pass against a live Jellyfin 12.0 server** - the checklist has not been run since 12.0 GA shipped on 2026-09-07, and this line is NOT part of the 4.x (Jellyfin 10.11) release-candidate gate. What it does carry since #1466 is the automated seven-stack provider matrix that gates this publish: it boots a live `jellyfin/jellyfin:12.0` server, installs the net10.0 artifact this release ships into it, and drives OIDC and SAML login round-trips against seven identity providers. That is the release the net10.0 build compiles against. The 5.0 line clears its own live-validation gate when the manual checklist has been run against a GA server; the GA build exists since 2026-09-07, so that run is the only condition left. Use these betas for testing, not production.
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish the draft release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.publish-assets.outputs.id }}
        REPO: ${{ github.repository }}
      run: gh api "repos/${REPO}/releases/${RELEASE_ID}" -X PATCH -F draft=false
    - name: Publish Beta Plugin Manifest
      uses: ./.github/actions/generate-manifest
      with:
        plugin-metadata: _dist/*.zip.meta.json
        repository: ${{ github.repository }}
        manifest-branch: manifest-beta
        include-prereleases: "true"
        github-token: ${{ github.token }}
    - name: Verify the published manifest
      uses: ./.github/actions/verify-manifest
      with:
        repository: ${{ github.repository }}
        manifest-branch: manifest-beta
        github-token: ${{ github.token }}
        expect-version: ${{ needs.gate.outputs.beta }}
        # 10.11.0.0 stays required though nothing here builds for it: 4.3 betas serve 10.11 servers.
        require-abis: "10.11.0.0 12.0.0.0"
