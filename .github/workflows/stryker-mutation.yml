# Weekly Stryker mutation run over the SAML, OIDC and login core; the score is reported, not gated.
# Keep the shard budget in the Stryker step: a job-level cancel ends `cancelled`, which alerts skip.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#stryker-mutationyml
name: Stryker mutation testing

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Per-shard time limit in minutes; the scheduled run uses 120 and the job backstop is 180"
        required: false
        default: "90"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (${{ matrix.scope.name }})
    runs-on: ubuntu-latest
    # A backstop for a hang before the Stryker step; it has to stay above SHARD_MINUTES (#1784).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scope:
          - name: saml
            mutate: "Api/Saml/*.cs"
          - name: oidc
            mutate: "Api/Oidc/*.cs"
          - name: core
            mutate: "Api/Authz/RolePrivilegeMapper.cs,Api/Session/LoginStatusMapper.cs,Api/Linking/AdoptionEligibilityResolver.cs"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Restore pinned .NET tools (Stryker)
        run: dotnet tool restore

      - name: Run Stryker (scoped, score-non-blocking)
        working-directory: SSO-Auth.Tests
        env:
          MUTATE: ${{ matrix.scope.mutate }}
          # Sized on the spread between two runners (50 and 70 minutes for saml), not on one reading.
          SHARD_MINUTES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.timeout_minutes || '120' }}
        run: |
          IFS="," read -ra globs <<< "$MUTATE"
          args=()
          for g in "${globs[@]}"; do args+=(-m "$g"); done
          set +e
          timeout --signal=TERM --kill-after=60s "${SHARD_MINUTES}m" dotnet stryker "${args[@]}"
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::This mutation shard passed its ${SHARD_MINUTES}-minute budget and was stopped. A shard that does not fit is a failed run, never a quiet one (#1784)."
            exit 1
          fi
          exit "$status"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-mutation-report-${{ matrix.scope.name }}
          path: SSO-Auth.Tests/StrykerOutput/**/reports/**
          retention-days: 14
          # A run that produced no report fails here; warn would let a broken run end green (#899).
          if-no-files-found: error

  verdict:
    name: Every shard reported
    runs-on: ubuntu-latest
    needs: mutation
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail the run unless every shard succeeded
        env:
          RESULT: ${{ needs.mutation.result }}
        run: |
          echo "matrix result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::At least one mutation shard did not succeed (result: $RESULT); a cancelled or report-less shard is a failed run, not a quiet one."
            exit 1
          fi
