# DCO gate (#746): every non-merge commit needs a Signed-off-by trailer matching its author.
# Do not rename the job: "DCO sign-off" is a required status context.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#dcoyml
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base..head range is walkable.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          # if ! guard: a substitution failure inside a for word list does not trip set -e (fail-open).
          if ! commits=$(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); then
            echo "::error::Could not walk the commit range ${BASE_SHA}..${HEAD_SHA}."
            exit 1
          fi
          for sha in $commits; do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            # Explicit allowlist of GitHub's own bot identities, not a [bot] glob, so nobody can self-exempt.
            case "$author_email" in
              *"+dependabot[bot]@users.noreply.github.com" \
              | "dependabot[bot]@users.noreply.github.com" \
              | *"+github-actions[bot]@users.noreply.github.com" \
              | "github-actions[bot]@users.noreply.github.com")
                echo "skip  $sha (bot: $author_email)"; continue ;;
            esac
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if git show -s --format='%B' "$sha" | grep -qxF "$expected"; then
              echo "ok    $sha"
            else
              echo "FAIL  $sha is missing: ${expected}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more commits lack a DCO Signed-off-by matching the author. Sign your work with 'git commit -s' (or add it retroactively with 'git rebase --signoff <base>'). See CONTRIBUTING.md and ./DCO."
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."
