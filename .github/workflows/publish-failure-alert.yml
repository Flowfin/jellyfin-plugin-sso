name: Publish failure alert

# Default-branch watchdog (#982, widened in #1015). A run that is not a required pull-request check does
# NOT email me the way a push failure to the author does, so a workflow can stay red on `main` unnoticed:
#  - the 2026-07-23 beta.12 incident, where the GitHub release was created but the manifest commit failed
#    on a jq arg-length error and the build silently never reached Jellyfin until a user noticed;
#  - `Wiki Lint` failing on `main` nine times in a row over fifteen hours (#1015), surfaced only because
#    the maintainer happened to open the run log.
#
# The first version of this file was event-driven and watched an ENUMERATED list of six workflow names,
# which is why the second incident went unseen: `Wiki Lint` was not on the list, and neither was any other
# scheduled or push-only guard. Coverage is now a PROPERTY, derived by asking the run list which runs on
# the default branch concluded non-success, so a workflow added to this repository is watched the day it
# lands and there is nothing to register anywhere. Outside these comments the file names no workflow at
# all: strip the comment lines and no workflow name is left to go stale.
#
# Why a sweep and not a `workflow_run` trigger. Watching every workflow by event needs a `workflow_run`
# trigger with no `workflows:` filter, and this repository's own workflow audit refuses to parse that
# ("data did not match any variant of untagged enum Trigger"), so the enumeration cannot simply be
# deleted. The sweep expresses the same property against the API instead, it can be exercised on demand
# with `dry_run` below, and it costs latency: a failure is reported at the next tick rather than within
# a minute of the run ending.
#
# Uses only the built-in gh CLI with the workflow token; no third-party action, so nothing to SHA-pin.

on:
  schedule:
    # Every half hour. The incident this exists for ran fifteen hours unseen, so the tick length is the
    # worst-case delay on a signal that previously never arrived at all.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be filed to the run log, and open or update no issue."
        type: boolean
        default: true

# Deny-all at the workflow level; the job opts into the two grants it needs.
permissions: {}

# Never run two sweeps at once; never cancel one mid-flight (it may be creating/commenting an issue).
# Serializing also closes the two-sweeps race: sweep B sees the issue sweep A created and comments on it
# instead of creating a duplicate.
concurrency:
  group: publish-failure-alert
  cancel-in-progress: false

jobs:
  sweep:
    name: Report any workflow that concluded non-success on the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read the run list, and file or update the tracking issue. Nothing else: no contents, so the job
      # cannot write to the tree, and no ability to re-run or cancel anything.
      actions: read
      issues: write
    steps:
      - name: Sweep the default branch and file or update the alert issue
        # All values reaching the shell are passed via env, never spliced in as ${{ }}.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          SELF: ${{ github.workflow }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          # Only failures this recent are reported. The window is what keeps a long-dead red run from
          # re-opening the tracking issue every time the issue is closed: after the cause is fixed and the
          # issue closed, nothing older than this can resurrect it.
          WINDOW_HOURS: "24"
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "-${WINDOW_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)

          # The derived set. No workflow is named: every run on the default branch is examined and the
          # conclusion decides. The conclusion test is a DENYLIST so a new or rare conclusion class is
          # caught by default rather than silently dropped - `failure`, `timed_out` and `startup_failure`
          # (a YAML/config error) all alert, and so do `neutral`, `action_required` and `stale`. Only
          # `success` and `skipped` are no-ops, `cancelled` is treated as an intentional human action, and
          # an empty conclusion means the run has not finished. This workflow excludes itself so that a
          # failing sweep does not sweep up its own failure; both sides of that test come from this same
          # file, so renaming the workflow keeps it correct with no second place to edit.
          gh run list --repo "$REPO" --branch "$BRANCH" --limit 100 \
            --json workflowName,conclusion,url,event,updatedAt > runs.json
          jq -r --arg self "$SELF" --arg cutoff "$cutoff" '
            .[]
            | select(.workflowName != $self)
            | select(.updatedAt >= $cutoff)
            | select((.conclusion // "") as $c
                     | $c != "success" and $c != "skipped" and $c != "cancelled" and $c != "")
            | [.url, .conclusion, .event, .workflowName] | @tsv
          ' runs.json > red.tsv

          echo "Examined $(jq length runs.json) run(s) on ${BRANCH}; $(wc -l < red.tsv) non-success since ${cutoff}."
          if [ ! -s red.tsv ]; then
            echo "Nothing red."
            # NOTHING RED MEANS CLOSE, and the watcher does the closing itself.
            #
            # It never did. #1314 went green at 21:20 and stayed open until it
            # was closed by hand at 21:50 - and because it was closed THEN, the
            # next tick filed #1354 afresh, for a failure that no longer
            # existed. A reporter that only ever opens produces dead entries and
            # duplicate reports, and for the same reason.
            open_issue=$(gh issue list --repo "$REPO" --state open --label release-alert \
              --json number --jq '.[0].number // empty')
            if [ -n "${open_issue:-}" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "DRY RUN: would close #${open_issue}."
              else
                gh issue comment "$open_issue" --repo "$REPO" --body "Nothing on \`${BRANCH}\` is red any more; \
          closing. Examined $(jq length runs.json) run(s) since ${cutoff}."
                gh issue close "$open_issue" --repo "$REPO" --reason completed
                echo "Closed #${open_issue}."
              fi
            else
              echo "No open alert issue to close."
            fi
            exit 0
          fi

          # Self-provision the dedup label so the sweep never dies on a missing/deleted label (the create
          # path is the first-fire path). --force makes it idempotent; failure here is non-fatal.
          gh label create release-alert --repo "$REPO" --color B60205 \
            --description "Automated alert: a workflow concluded non-success on the default branch (see #982, #1015)" \
            --force >/dev/null 2>&1 || true

          # The release-alert label is the dedup key: one open tracking issue, updated by comment, so a
          # guard that flaps files one issue and comments on it rather than filing an issue per failure.
          # The label name is kept from #982 so a tracking issue that is already open stays the one this
          # finds. Everything already written on that issue is the second dedup key: a run whose URL is
          # there has been reported, and every later sweep passes over it in silence.
          num=$(gh issue list --repo "$REPO" --state open --label release-alert \
            --json number --jq '.[0].number // empty')
          reported=""
          if [ -n "${num:-}" ]; then
            reported=$(gh issue view "$num" --repo "$REPO" --json body,comments \
              --jq '.body, (.comments[].body)')
          fi

          # WHAT IS RED, WITH THE REASON - and the reason comes from the log.
          #
          # Until 2026-08-17 a fixed template stood here: name, conclusion,
          # trigger, link. It said THAT something was red, and never WHAT. #1314
          # ran on that template for seven days and 29 identically worded
          # comments, while the cause - a missing hyphen in a wiki anchor - sat
          # in the first run's log the entire time.
          #
          # `gh run view --log-failed` returns exactly the step that failed. The
          # watcher always had the run number; it simply never asked.
          : > state.md
          : > key.txt
          # ONE SECTION PER WORKFLOW, NOT PER RUN.
          #
          # The second dry run on 2026-08-17 wrote `### Wiki Lint` twice, one
          # under the other, because three red runs of the same workflow stood
          # in red.tsv. That is the same repetition that began as 29 comments,
          # moved into one body rather than fixed.
          #
          # red.tsv is sorted by recency, so the FIRST entry per workflow is the
          # newest; the number of runs is carried separately in the text anyway.
          awk -F'\t' '!seen[$4]++' red.tsv > per-workflow.tsv
          while IFS=$'\t' read -r url conclusion event wf_name; do
            run_id="${url##*/}"
            step=$(gh run view "$run_id" --repo "$REPO" --json jobs \
              --jq '[.jobs[] | select(.conclusion=="failure") | .steps[]
                     | select(.conclusion=="failure") | .name][0] // "unknown"' 2>/dev/null || echo "unknown")
            # THE END OF THE LOG, CAPPED. A whole job log bursts any issue and
            # for that reason goes unread; the last lines of the red step are
            # what a reader looks at first.
            # ONLY THE LINES OF THE FAILED STEP, and the reason is in the dry
            # run of 2026-08-17: `tail` over the whole job log returns the
            # TEARDOWN - "Removing SSH command configuration", "Cleaning up
            # orphan processes" - and not the error, which stands further up.
            # The report would have been longer and exactly as useless as the
            # template it replaces.
            #
            # AND NOT VIA THE STEP COLUMN, because that column carries nothing.
            # Measured on 2026-08-17 against a red run: `--log-failed` wrote ALL
            # 175 lines with `UNKNOWN STEP`, while the jobs API names the step
            # cleanly. A filter on it never matches and yields "(no log
            # available)" - which is exactly what the second dry run produced.
            #
            # The reliable anchor is the error marker the runner sets itself:
            # the lines BEFORE the first `##[error]` are the output that tipped
            # the run over. The teardown sits behind it and so drops away by
            # itself.
            log_excerpt=$(gh run view "$run_id" --repo "$REPO" --log-failed 2>/dev/null \
              | sed 's/\r$//' \
              | sed 's/^[^\t]*\t[^\t]*\t//' | sed 's/^[0-9TZ:.-]\{20,\} //' \
              | grep -vE '^\s*$' | grep -vE '^##\[(group|endgroup)\]' \
              | awk '/##\[error\]/ { found=1; for (i=1;i<=n;i++) print buffer[i]; print; exit }
                     { buffer[++n]=$0; if (n>12) { for (i=1;i<n;i++) buffer[i]=buffer[i+1]; n-- } }
                     END { if (!found) for (i=1;i<=n;i++) print buffer[i] }' \
              | cut -c1-200 || true)
            [ -n "$log_excerpt" ] || log_excerpt="(no log available)"
            printf '%s\t%s\n' "$wf_name" "$step" >> key.txt
            # How many red runs of this workflow, and since when.
            count=$(cut -f4 red.tsv | grep -cxF "$wf_name" || echo 1)
            since=$(jq -r --arg w "$wf_name" '[.[] | select(.workflowName==$w)
                     | select((.conclusion // "") as $c
                              | $c != "success" and $c != "skipped" and $c != "cancelled" and $c != "")
                     | .updatedAt] | sort | .[0] // ""' runs.json)
            {
              printf '### %s\n\n' "$wf_name"
              printf 'Failing step: **%s** (conclusion `%s`, trigger `%s`)\n\n' \
                "$step" "$conclusion" "$event"
              printf '```\n%s\n```\n\n' "$log_excerpt"
              printf 'Red since `%s`, %s run(s) in this window. Latest: %s\n\n' \
                "${since:-unknown}" "$count" "$url"
            } >> state.md
          done < per-workflow.tsv

          # THE BODY HOLDS THE STATE, COMMENTS HOLD THE TRANSITIONS.
          #
          # The old watcher commented per RED RUN, and its dedup key was the run
          # URL - which by definition changes with every run. Every push to main
          # therefore produced one more identically worded comment. 29 of them
          # for a single cause.
          #
          # The key is now workflow PLUS failed step. If that does not change,
          # only the body is updated and nothing is said; if a new step appears,
          # that is news.
          header="Workflows on \`${BRANCH}\` are red. This body is rewritten each tick and always
          shows the CURRENT state; comments below mark changes only.

          A failure on the default branch is not a required pull-request check and is not emailed, so it
          can stay red while every pull request shows green. If this was a publish or monitoring workflow,
          a release channel may also not have updated and installs can go stale unnoticed - check whether
          a GitHub release was created but its channel manifest was not committed (the beta.12 mode).

          The watcher closes this issue itself once nothing is red.

          Refs #982, #1015, #1357."
          body="$header

          $(cat state.md)"
          new_key=$(sort -u key.txt | tr '\t' ':' | tr '\n' ';')

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN, filing nothing. Would report: ${new_key}"
            echo "--- body ---"; echo "$body"
            exit 0
          fi

          if [ -n "${num:-}" ]; then
            # The marker was spelled differently before #1362 renamed it, so on the first tick after
            # that change this read finds nothing and the comparison below reports a transition. That
            # is one comment, once, and the semantics of the key are unchanged: workflow plus step.
            old_key=$(printf '%s' "$reported" | sed -n 's/.*<!-- key: \(.*\) -->.*/\1/p' | head -1)
            gh issue edit "$num" --repo "$REPO" --body "$body

          <!-- key: ${new_key} -->"
            if [ "$old_key" != "$new_key" ]; then
              echo "Failing set changed; commenting."
              gh issue comment "$num" --repo "$REPO" --body "The set of red workflows changed.

          Now: ${new_key}
          Before: ${old_key:-(nothing recorded)}

          The body above carries the current state and the failing step's log."
            else
              echo "Same failing set as before; body refreshed, no comment."
            fi
          else
            echo "No open alert issue; creating one."
            num=$(gh issue create --repo "$REPO" --label release-alert \
              --title "A workflow concluded non-success on the default branch" \
              --body "$body

          <!-- key: ${new_key} -->" | grep -o '[0-9]*$')
          fi
