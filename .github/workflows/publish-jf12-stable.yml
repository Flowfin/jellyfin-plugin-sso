# Publishes a Jellyfin 12 stable from a pushed X.Y.Z-JF12-stable tag: build, release, manifests.
# Never add a fourth octet to build.yaml to outrank the betas: raise the line, keep three parts.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Releasing#publish-jf12-stableyml
name: Publish JF12 Stable

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-JF12-stable"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-manifest-release
  cancel-in-progress: false

jobs:
  build:
    name: Build the JF12 stable package
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"
      attest: true

  publish:
    name: Publish JF12 stable
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    # The checkout comes first: actions/checkout cleans the workspace and would delete a download.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download the package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifact
        path: _dist
    - name: Download the SBOM
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom-artifact
        path: _dist
    - name: Download the VEX
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vex-artifact
        path: _dist
    # Refuses ahead of the immutable release: a stable numbered below its betas is never offered.
    - name: The release must outrank every beta of its line
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |-
        set -euo pipefail
        set -- _dist/*.zip.meta.json
        if [ "$#" -ne 1 ] || [ ! -s "$1" ]; then
          echo "::error::_dist/*.zip.meta.json resolved to $# path(s); expected exactly one readable file"
          exit 1
        fi
        version="$(jq -r '.version // empty' "$1")"
        [ -n "$version" ] || { echo "::error::$1 carries no version"; exit 1; }
        line="$(printf '%s' "$version" | cut -d. -f1-3)"
        mine="$(printf '%s' "$version" | cut -d. -f4)"
        [ -n "$mine" ] || mine=0
        gh api --paginate --method GET -f per_page=100 "repos/${REPO}/releases" \
          --jq '.[] | select(.draft | not) | .tag_name' > tags.txt
        highest=""
        while read -r tag; do
          case "$tag" in
            "$line"-JF12-beta.*|"$line"-beta.*) run="${tag##*.}" ;;
            *) continue ;;
          esac
          case "$run" in ''|*[!0-9]*) continue ;; esac
          if [ -z "$highest" ] || [ "$run" -gt "$highest" ]; then highest="$run"; fi
        done < tags.txt
        rm -f tags.txt
        if [ -z "$highest" ]; then
          echo "no beta of line $line has been published, so $version outranks the line by default"
          exit 0
        fi
        echo "line $line: the highest beta is $line.$highest, this release is $version"
        if [ "$mine" -le "$highest" ]; then
          next="$(printf '%s' "$line" | awk -F. '{print $1 "." $2 "." $3 + 1}')"
          echo "::error::$version does not outrank $line.$highest, the highest beta of its own line. A server on that beta is offered an update only by a HIGHER version, so this release would reach it and be ignored. Move build.yaml to a line the betas have not reached - $next or higher - and re-tag: $next.0 sorts above $line.$highest, and no beta of that line exists yet. Do NOT add a fourth octet to build.yaml; the nightly beta leg reads it with a three-part pattern and refuses anything else."
          exit 1
        fi
        echo "$version outranks every beta of line $line"
    - name: Prepare GitHub Release assets
      run: |-
        pushd _dist
        ls ./*.zip.intoto.jsonl
        # ONLY the plugin zip gets a .md5: the manifest generator keeps the LAST .md5 as checksum.
        for file in ./*.zip; do
          md5sum ${file#./} > ${file%.*}.md5
          sha256sum ${file#./} > ${file%.*}.sha256
        done
        sha256sum sbom.cyclonedx.json > sbom.cyclonedx.sha256
        sha256sum openvex.json > openvex.sha256
        ls -l
        popd
    - name: Publish output artifacts
      id: publish-assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            _dist/*
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish Plugin Manifest
      uses: ./.github/actions/generate-manifest
      with:
        plugin-metadata: _dist/*.zip.meta.json
        repository: ${{ github.repository }}
        manifest-branch: manifest-release
        include-prereleases: "false"
        github-token: ${{ github.token }}
    - name: Verify the published manifest
      uses: ./.github/actions/verify-manifest
      with:
        repository: ${{ github.repository }}
        manifest-branch: manifest-release
        github-token: ${{ github.token }}
        # 10.11.0.0 stays required though nothing here builds for it: 4.3.0 serves 10.11 servers.
        require-abis: "10.11.0.0 12.0.0.0"

  carry-into-beta:
    name: Carry the release into the beta channel
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-manifest-beta
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download the package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifact
        path: _dist
    - name: Read the published version
      id: version
      run: |-
        set -euo pipefail
        set -- _dist/*.zip.meta.json
        if [ "$#" -ne 1 ] || [ ! -s "$1" ]; then
          echo "::error::_dist/*.zip.meta.json resolved to $# path(s); expected exactly one readable file"
          exit 1
        fi
        version="$(jq -r '.version // empty' "$1")"
        [ -n "$version" ] || { echo "::error::$1 carries no version"; exit 1; }
        echo "carried=$version" >> "$GITHUB_OUTPUT"
    - name: Publish the beta manifest
      uses: ./.github/actions/generate-manifest
      with:
        plugin-metadata: _dist/*.zip.meta.json
        repository: ${{ github.repository }}
        manifest-branch: manifest-beta
        include-prereleases: "true"
        github-token: ${{ github.token }}
    - name: Verify the published manifest
      uses: ./.github/actions/verify-manifest
      with:
        repository: ${{ github.repository }}
        manifest-branch: manifest-beta
        github-token: ${{ github.token }}
        expect-version: ${{ steps.version.outputs.carried }}
        require-abis: "10.11.0.0 12.0.0.0"
