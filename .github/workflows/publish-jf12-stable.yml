name: Publish JF12 Stable

# The Jellyfin 12 (.NET 10) STABLE channel - the 5.x line's GA publish leg (#607). Counterpart to
# publish-jf12-beta.yml (the beta leg); the 10.11 stable leg, publish.yml (X.Y.Z-stable), stays on `main`
# with the 4.3 line and is not on this branch (#1770). Triggered ONLY by me pushing an X.Y.Z-JF12-stable
# tag (e.g. 5.0.0-JF12-stable): publish.yml's [0-9]+.[0-9]+.[0-9]+-stable glob deliberately does NOT
# match -JF12-stable, so the two stable legs never cross-fire. This tag is GATED ON MY EXPLICIT GO
# (guard-git.ps1) and pushed by hand.
#
# DORMANT until Jellyfin 12.0 reaches GA: no X.Y.Z-JF12-stable tag is pushed until a real 12.0 stable
# server exists, so this workflow does not run before then - but the pipeline is ready so the 5.0 line can
# cut a stable release the day 12.0 ships. Until GA, JF12 users are served by the beta channel (#605).
#
# The build METADATA (version, targetAbi 12.0.0.0, framework net10.0, the net10 shipping closure) is
# build.yaml, the one metadata file since #1770; nothing is copied over it before JPRM builds. The full
# release (prerelease: false, one shot like publish.yml) regenerates the SHARED manifest-release
# (ignorePrereleases: true) - the same stable pages branch publish.yml wrote 4.3.0 into. Each release
# ships its own build.yaml, so Jellyfin filters client-side by targetAbi: a 12.0 server installs the 5.x
# build, a 10.11 server 4.3.0, from one stable manifest - no separate manifest is needed.
#
# NO PROVIDER MATRIX HERE, DELIBERATELY, FOR THE SAME REASON AS publish.yml (#1464). The two beta legs
# are gated on the seven-stack harness because they publish daily; both stable legs write the empty
# `manifest-release` branch and have published nothing since #954, so a gate added here would be one no
# run has ever started. It is wired in the change that cuts the first stable tag of this line.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-JF12-stable"
  workflow_dispatch:

# Explicit deny-all at workflow level; the job below opts into write access explicitly.
permissions: {}

# Serialize manifest-release regenerations so two writers never race the pages branch (the same
# reader-vs-pusher TOCTOU #135 fixed for manifest-beta). cancel-in-progress is false: a publish holding
# contents:write must never be killed mid-run. regenerate-manifest.yml joins this same group name for the
# release channel, and so does publish.yml on `main`, so a 4.3 stable publish there and one here can never
# regenerate manifest-release concurrently.
concurrency:
  group: publish-manifest-release
  cancel-in-progress: false

jobs:
  # THE PACKAGE IS BUILT BY THE REUSABLE build.yml, WITH PROVENANCE (#1833). Until that change this leg
  # built inline and attested nothing, so 5.0.0-JF12-stable shipped with no attestation while SECURITY.md
  # told a reader to verify one. Calling build.yml is what makes the recorded builder a reusable workflow
  # (SLSA Build L3), and it keeps the signing scopes away from both the SBOM tool, which runs in
  # build.yml's own sbom job, and the write grant, which only `publish` below holds. The caller contract
  # in build.yml's header is why this job grants id-token and attestations write. The inline job also ran
  # a `dotnet build --warnaserror` of the whole solution; JPRM compiles the plugin under the same
  # Directory.Build.props, which sets TreatWarningsAsErrors and, on Actions, RestoreLockedMode, and the
  # test, bench and fuzz projects are compiled by the pull-request CI rather than here.
  build:
    name: Build the JF12 stable package
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"
      attest: true

  publish:
    name: Publish JF12 stable
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Creates the GitHub release and updates the manifest branch, so it opts into write access.
    permissions:
      contents: write

    steps:
    # THE CHECKOUT COMES FIRST AND THE ORDER IS LOAD-BEARING: actions/checkout cleans the workspace, so a
    # checkout after the downloads would delete what they fetched. The tree is here only so the two local
    # actions below resolve.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The zip, JPRM's `*.zip.meta.json`, build.yaml and the provenance bundle `<zip>.intoto.jsonl`.
    # The stable plugin version IS build.yaml's committed version and must equal the pushed tag's numeric
    # prefix (5.0.0 <-> 5.0.0-JF12-stable); bump build.yaml per change class before tagging.
    - name: Download the package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifact
        path: _dist
    # CycloneDX SBOM of the net10 shipping closure, generated in build.yml's isolated sbom job.
    - name: Download the SBOM
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sbom-artifact
        path: _dist
    # The committed OpenVEX document (#1092/#1093).
    - name: Download the VEX
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vex-artifact
        path: _dist
    - name: Prepare GitHub Release assets
      run: |-
        pushd _dist
        # A release without its provenance bundle is the defect #1833 repaired, so its absence reds
        # here rather than publishing without it.
        ls ./*.zip.intoto.jsonl
        # ONLY the plugin zip gets a `.md5` - see the same note in publish-beta.yml. The
        # manifest generator keeps the LAST asset ending in `.md5`, so a second one
        # sorting after the plugin's becomes the published checksum and every install
        # fails verification.
        for file in ./*.zip; do
          md5sum ${file#./} > ${file%.*}.md5
          sha256sum ${file#./} > ${file%.*}.sha256
        done
        sha256sum sbom.cyclonedx.json > sbom.cyclonedx.sha256
        # Also the staging check: sha256sum exits non-zero on a missing file under `bash -e`,
        # so a leg that failed to place the document reds here instead of publishing without it.
        sha256sum openvex.json > openvex.sha256
        ls -l
        popd
    - name: Publish output artifacts
      id: publish-assets
      # Full stable release in ONE shot (prerelease: false), matching publish.yml - no draft flow. The
      # git TAG is the pushed X.Y.Z-JF12-stable; the release NAME is that same tag. build.yaml ships as
      # an asset so the SHARED manifest-release reads THIS release's version and targetAbi (12.0.0.0)
      # from the release rather than from whatever the tree holds later; build.yml stages it into the
      # package, so it arrives under `_dist/*` and is not listed a second time. fail_on_unmatched_files
      # stays true so a missing build asset fails the run rather than publishing an empty release.
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
          name: ${{ github.ref_name }}
          prerelease: false
          # Always auto-generate the release notes from the merged PRs/commits since the previous tag.
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          # Anchor the tag AND the auto-generated notes to the built commit (#627). Without this the
          # create-release API defaults target_commitish to the repository DEFAULT branch, which tags the
          # wrong commit and makes generate_release_notes diff the wrong range. github.sha is the commit
          # the pushed X.Y.Z-JF12-stable tag points at.
          target_commitish: ${{ github.sha }}
          files: |
            _dist/*
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish Plugin Manifest
      # ignorePrereleases: true - the STABLE channel. Regenerates the SHARED manifest-release from all
      # full (non-prerelease) releases: this build (targetAbi 12.0.0.0) and the 4.x stable releases
      # publish.yml made, ending with 4.3.0 (targetAbi 10.11.0.0). Each release ships its own build.yaml,
      # so every version lands in the manifest with its correct targetAbi and a Jellyfin server installs
      # only the build matching its generation.
      uses: ./.github/actions/generate-manifest
      with:
        plugin-metadata: _dist/*.zip.meta.json
        repository: ${{ github.repository }}
        manifest-branch: manifest-release
        include-prereleases: "false"
        github-token: ${{ github.token }}
    - name: Verify the published manifest
      # Post-publish DETECTOR for the class of "the manifest ships a checksum that matches
      # nothing" (#942) - it turns a silent, user-facing install outage into a red build.
      # It does not prevent: the release is already sealed and the manifest already written
      # by the time it runs.
      uses: ./.github/actions/verify-manifest
      with:
        repository: ${{ github.repository }}
        manifest-branch: manifest-release
        github-token: ${{ github.token }}
        # 10.11.0.0 stays required: 4.3.0 is the last build a 10.11 server can install, and a
        # regeneration that lost it would empty that generation's repository (#943, #1770).
        require-abis: "10.11.0.0 12.0.0.0"
