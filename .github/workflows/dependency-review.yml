# Dependency review on every pull request: new or upgraded dependencies checked for advisories.
# Do not add a name: to the job: the required status context is the job id "dependency-review".
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#dependency-reviewyml
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a new or upgraded dependency blocks the PR.
          fail-on-severity: low
