# CodeQL advanced setup: csharp, javascript-typescript, actions; security-extended; all code lines.
# Do not rename the workflow or a matrix language: "CodeQL" and "Analyze (csharp)" are required.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Review-Gate#codeqlyml
name: CodeQL

on:
  push:
    # The 4.* / 5.* globs match numeric release branches only; add a non-numeric line by hand.
    branches: [main, "4.2", "4.*", "5.*"]
  pull_request:
    branches: [main, "4.2", "4.*", "5.*"]
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the analysis SARIF into the code-scanning tab
      contents: read # check out the code to analyze
      actions: read # required for CodeQL to analyze the `actions` language and read workflow runs
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Match the default setup's suite exactly - no coverage regression.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
