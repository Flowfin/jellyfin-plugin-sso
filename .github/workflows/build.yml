# Reusable build: JPRM packages the plugin, optionally attests it (SLSA L3), uploads zip, SBOM, VEX.
# Every caller must grant contents:read, id-token:write, attestations:write, even with attest false.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Releasing#buildyml
name: Build

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        default: "10.0.x"
        description: "The .NET version to setup for the build"
        type: string
      dotnet-target:
        required: false
        default: "net10.0"
        description: "The .NET target to set for JPRM"
        type: string
      attest:
        required: false
        default: false
        description: "Emit a signed SLSA build-provenance attestation for the built artifact. Release-only; leave false for CI/PR builds."
        type: boolean
      version:
        required: false
        default: ""
        description: "Plugin version to build instead of build.yaml's. Empty builds build.yaml's version unchanged."
        type: string

permissions: {}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "${{ inputs.dotnet-version }}"

      - name: Check the requested version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qxE '[0-9]+(\.[0-9]+){2,3}'; then
            echo "::error::version '${VERSION}' is not a three- or four-part dotted number"; exit 1
          fi

      - name: Set the requested version in build.yaml
        if: ${{ inputs.version != '' }}
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          valueFile: "build.yaml"
          propertyPath: "version"
          value: ${{ inputs.version }}
          commitChange: false
          updateFile: true

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: "${{ inputs.dotnet-target }}"
          version: "${{ inputs.version }}"

      - name: Attest build provenance
        id: attest
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.jprm.outputs.artifact }}"

      # The bundle name ends in neither .zip nor .md5, which the manifest generator selects by.
      - name: Stage the provenance bundle and build.yaml beside the zip
        id: stage
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          dir="$(dirname "$ARTIFACT")"
          cp build.yaml "${dir}/build.yaml"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          if [ -n "$BUNDLE" ]; then
            cp "$BUNDLE" "${ARTIFACT}.intoto.jsonl"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          # A re-run of all jobs uploads under the same run id; without overwrite that conflicts.
          overwrite: true
          # The .intoto.jsonl path matches no file when attest is false; that adds nothing.
          path: |
            ${{ steps.jprm.outputs.artifact }}
            ${{ steps.jprm.outputs.artifact }}.meta.json
            ${{ steps.jprm.outputs.artifact }}.intoto.jsonl
            ${{ steps.stage.outputs.dir }}/build.yaml

  # No signing scopes on purpose: the SBOM tool is a run-time NuGet install (SLSA L3 isolation).
  sbom:
    name: Generate SBOM
    if: ${{ inputs.attest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Generate CycloneDX SBOM
        id: sbom
        uses: ./.github/actions/cyclonedx-sbom
        with:
          output-dir: sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: sbom-artifact
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.sbom.outputs.sbom-path }}

      - name: Upload VEX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: vex-artifact
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: security/vex/openvex.json
