# Emits a CycloneDX JSON SBOM of the plugin's locked net10.0 restore graph for a publish leg.
# Keep --disable-package-restore: the SBOM must describe the locked closure, not a fresh restore.
# https://github.com/Flowfin/jellyfin-plugin-sso/wiki/Releasing#actionscyclonedx-sbom
name: Generate CycloneDX SBOM
description: >-
  Emit a CycloneDX JSON SBOM for the SSO-Auth plugin from the locked restore
  graph the caller has already materialised, so a release can carry the
  dependency inventory CRA Annex I / OSPS-QA-02.02 expect. The single generator
  for every publish leg (DRY): each leg calls this action, none re-implements it.
  The SBOM covers the plugin's net10.0 / Jellyfin 12 dependency closure, the one
  target since #1770, as pinned in the committed packages.lock.json - the whole
  restored graph rather than only what the zip carries, never an under-report.
inputs:
  output-dir:
    description: >-
      Existing directory the SBOM JSON is written into (e.g. the publish leg's
      `_dist` staging dir, or a fresh `sbom` dir in the reusable build).
    required: true
outputs:
  sbom-path:
    description: Path to the generated CycloneDX JSON SBOM.
    value: ${{ steps.generate.outputs.sbom-path }}
runs:
  using: composite
  steps:
    - name: Generate CycloneDX SBOM
      id: generate
      shell: bash
      # A NuGet global tool is pinned by version; the output path goes through env, never the script.
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR"
        dotnet tool install --global CycloneDX --version 6.2.0
        export PATH="$HOME/.dotnet/tools:$PATH"
        dotnet-CycloneDX SSO-Auth/SSO-Auth.csproj \
          --output-format Json \
          --output "$OUTPUT_DIR" \
          --filename sbom.cyclonedx.json \
          --set-nuget-purl \
          --exclude-test-projects \
          --disable-package-restore
        echo "sbom-path=$OUTPUT_DIR/sbom.cyclonedx.json" >> "$GITHUB_OUTPUT"
